const CS_STORE_KEY='hashcloud_customer_service_v1';

function csLoadMessages(){try{const all=JSON.parse(localStorage.getItem(CS_STORE_KEY)||'{}'),uid=String(globalThis.authStore?.currentUser?.uid||'guest');return Array.isArray(all[uid])?all[uid]:[]}catch(_){return []}}

async function csApiGetMessages(uid){/* Backend API hook: GET /api/v1/customer-service/messages?uid={uid} */return csLoadMessages()}
async function csApiSendMessage(payload){/* Backend API hook: POST /api/v1/customer-service/send with { uid, username, message, timestamp } */return {ok:true,storedLocally:true,payload}}
function csEscape(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function csRenderMessages(){const box=document.getElementById('poke-cs-messages');if(!box)return;box.innerHTML=csMessages.map(m=>'<div class="poke-cs-msg '+(m.role==='user'?'user':'system')+'">'+csEscape(m.text)+'<span class="poke-cs-time">'+csEscape(m.time||'')+'</span></div>').join('');box.scrollTop=box.scrollHeight}
async function csToggleChat(){const win=document.getElementById('poke-cs-window');if(!win)return;const opening=!win.classList.contains('open');win.classList.toggle('open',opening);if(opening){if(!csMessages.length){const uid=String(globalThis.authStore?.currentUser?.uid||'guest');csMessages=await csApiGetMessages(uid);if(!csMessages.length)csMessages=[{role:'system',text:CS_GREETING,time:''}]}csRenderMessages();setTimeout(()=>document.getElementById('poke-cs-input')?.focus(),50)}}
function csCloseChat(){document.getElementById('poke-cs-window')?.classList.remove('open')}
async function csSendMessage(){const input=document.getElementById('poke-cs-input'),message=String(input?.value||'').trim();if(!message)return;const user=globalThis.authStore?.currentUser||{},payload={uid:String(user.uid||''),username:String(user.username||''),message,timestamp:new Date().toISOString()};csMessages.push({role:'user',text:message,time:new Date(payload.timestamp).toLocaleTimeString()});if(input)input.value='';csStoreMessage();csRenderMessages();await csApiSendMessage(payload);setTimeout(()=>{csMessages.push({role:'system',text:CS_REPLY,time:new Date().toLocaleTimeString()});csStoreMessage();csRenderMessages()},900)}
function csPointerDown(event){if(event.type==='mousedown'&&event.button!==0)return;const el=document.getElementById('poke-cs-widget');if(!el)return;event.preventDefault();const rect=el.getBoundingClientRect(),touch=event.touches?.[0],x=touch?touch.clientX:event.clientX,y=touch?touch.clientY:event.clientY;csDrag={el,pointerId:event.pointerId??null,offsetX:x-rect.left,offsetY:y-rect.top};csHasDragged=false;csStartX=x;csStartY=y;csStartLeft=rect.left;csStartTop=rect.top;window.addEventListener('mousemove',csPointerMove);window.addEventListener('mouseup',csPointerUp,{once:true});window.addEventListener('touchmove',csPointerMove,{passive:false});window.addEventListener('touchend',csPointerUp,{once:true});window.addEventListener('touchcancel',csPointerUp,{once:true})}
function csPointerMove(event){if(!csDrag)return;const t=event.touches?.[0],x=t?t.clientX:event.clientX,y=t?t.clientY:event.clientY;if(t)event.preventDefault();if(Math.hypot(x-csStartX,y-csStartY)>5)csHasDragged=true;if(!csHasDragged)return;const w=csDrag.el.offsetWidth,h=csDrag.el.offsetHeight,left=Math.min(Math.max(0,x-csDrag.offsetX),innerWidth-w),top=Math.min(Math.max(0,y-csDrag.offsetY),innerHeight-h);csDrag.el.style.left=left+'px';csDrag.el.style.top=top+'px';csDrag.el.style.right='auto';csDrag.el.style.bottom='auto';const win=document.getElementById('poke-cs-window');if(win&&!win.classList.contains('open')){win.style.left=Math.max(8,Math.min(innerWidth-380,left-305))+'px';win.style.right='auto';win.style.top=Math.max(8,Math.min(innerHeight-330,top-510))+'px';win.style.bottom='auto'}}

globalThis.csPointerDown=csPointerDown;globalThis.csPointerMove=csPointerMove;globalThis.csPointerUp=csPointerUp;globalThis.csToggleChat=csToggleChat;globalThis.csCloseChat=csCloseChat;globalThis.csSendMessage=csSendMessage;globalThis.csApiGetMessages=csApiGetMessages;globalThis.csApiSendMessage=csApiSendMessage;
