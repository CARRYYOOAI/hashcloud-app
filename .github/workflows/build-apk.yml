name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor 6 LTS (pinned)
        run: npm install --save-exact @capacitor/cli@6.2.1 @capacitor/core@6.2.1 @capacitor/android@6.2.1

      - name: Build web assets
        run: npm run build

      - name: Add Android platform if missing
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject custom app icon when present
        run: |
          if [ -f icon.png ]; then
            echo "Injecting custom app icon..."
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              target="android/app/src/main/res/$dir"
              mkdir -p "$target"
              cp icon.png "$target/ic_launcher.png"
              cp icon.png "$target/ic_launcher_round.png"
              cp icon.png "$target/ic_launcher_foreground.png"
            done
          fi

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
