name: Build-APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init HASHCLOUD com.hashcloud.telemetry --web-dir www
          mkdir -p www
          cp index.html www/index.html
          npx cap add android
          npx cap sync android

          # Capacitor Android launcher resources live under android/app/src/main/res.
          # Copy while still at the repository root so the destination path is correct.
          if [ -f icon.png ]; then
            echo "Injecting custom app icon..."
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              target="android/app/src/main/res/$dir"
              mkdir -p "$target"
              cp icon.png "$target/ic_launcher.png"
              cp icon.png "$target/ic_launcher_round.png"
              cp icon.png "$target/ic_launcher_foreground.png"
            done
          else
            echo "No root icon.png found; keeping the default Capacitor app icon."
          fi

          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HASH-CLOUD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
