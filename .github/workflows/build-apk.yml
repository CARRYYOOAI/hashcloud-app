name: Build-APK
on:
workflow_dispatch:
push:
branches: [main]jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: 20
- uses: actions/setup-java@v4
with:
distribution: zulu
java-version: 17
- uses: android-actions/setup-android@v3
- run: npm init -y && npm i @capacitor/core @capacitor/cli @capacitor/android && npx cap init HASH com.hash.app --web-dir www && mkdir -p www && cp index.html www/index.html && npx cap add android && npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug
- uses: actions/upload-artifact@v4
with:
name: HASH-CLOUD-App
path: android/app/build/outputs/apk/debug/app-debug.apk
