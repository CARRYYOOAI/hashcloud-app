name: Build-APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          npm init -y
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
          npx cap init HASHCLOUD com.hashcloud.telemetry --web-dir www
          mkdir -p www
          cp index.html www/index.html
          npx cap add android
          npx cap sync android

          if [ -f icon.png ]; then
            echo "Injecting custom app icon..."
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              target="android/app/src/main/res/$dir"
              mkdir -p "$target"
              cp icon.png "$target/ic_launcher.png"
              cp icon.png "$target/ic_launcher_round.png"
              cp icon.png "$target/ic_launcher_foreground.png"
            done
          else
            echo "No root icon.png found; keeping the default Capacitor app icon."
          fi

          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HASH-CLOUD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
